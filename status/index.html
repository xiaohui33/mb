<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>主机</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 760px; padding: 10px 16px 10px;
    background: #fff; color: #000;
    font-family: "Songti SC", "Noto Serif CJK SC", serif;
    -webkit-text-size-adjust: 100%;
  }
  html, body { height: 100%; }
  #main { overflow: auto; -webkit-overflow-scrolling: touch; }
  .tabbar { background: #d0d0d0; border-top: 2px solid #000;
            padding: 3px 0 0 6px; }
  .tabbar a { display: inline-block; font-size: 19px; line-height: 1;
              padding: 6px 16px 5px; color: #000; text-decoration: none;
              background: #d0d0d0; border: 1px solid #000; border-bottom: none;
              margin-right: -1px; }
  .tabbar a.cur { background: #fff; font-weight: bold;
                  border-top: 3px solid #000; padding-top: 4px; }
  .clock { font-size: 96px; font-weight: bold; line-height: 0.95; text-align: center;
           letter-spacing: 2px; margin: 6px 0 2px; }
  .date { font-size: 24px; text-align: center; margin-bottom: 14px; }
  .hero { width: 100%; border-collapse: collapse; }
  .hero td { vertical-align: middle; padding: 0; }
  .big { font-size: 118px; font-weight: bold; line-height: 0.95; }
  .deg { font-size: 44px; font-weight: normal; }
  .cond { font-size: 40px; font-weight: bold; line-height: 1.1; margin-bottom: 6px; }
  .sub { font-size: 24px; line-height: 1.55; }
  .rule { border-top: 3px solid #000; margin: 14px 0 12px; }
  .thin { border-top: 1px solid #000; margin: 12px 0; }
  .line { font-size: 26px; line-height: 1.6; }
  .line b { font-size: 30px; }
  h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: 1px; }
  table.fc { width: 100%; border-collapse: collapse; }
  table.fc th { text-align: left; font-size: 20px; font-weight: normal;
                border-bottom: 3px solid #000; padding: 4px 2px 8px; }
  table.fc td { font-size: 25px; padding: 12px 2px; border-bottom: 1px solid #000; }
  table.fc tr:last-child td { border-bottom: none; }
  .r { text-align: right; }
  .wd { font-weight: bold; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { font-size: 26px; padding: 14px 2px; border-bottom: 1px solid #000; }
  table.kv tr:last-child td { border-bottom: none; }
  .foot { font-size: 19px; text-align: center; margin-top: 16px;
          border-top: 1px solid #000; padding-top: 10px; }
</style>
</head>
<body>
<div id="main">

<div class="clock" id="clock">16:53</div>
<div class="date" id="date">11 月 14 日　星期六</div>
<div class="hero"><table><tr><td>
  <div class="cond">主机运行状态</div>
  <div class="sub">QwenPaw · 本容器</div>
</td></tr></table></div>
<div class="rule"></div>
<table class="kv">
  <tr><td>主进程已运行</td><td class="r">1 天 0 时</td></tr>
  <tr><td>内存占用</td><td class="r">1.5 / 3.7 GB</td></tr>
  <tr><td>系统负载</td><td class="r">0.11 0.39 0.43</td></tr>
  <tr><td>磁盘</td><td class="r">0 / 29 GB</td></tr>
  <tr><td>会话数</td><td class="r">6 个</td></tr>
  <tr><td>QQ 通道</td><td class="r">正常</td></tr>
  <tr><td>组网</td><td class="r">在线</td></tr>
</table>

<div class="foot">每 10 分钟自动刷新　·　16:53</div>
</div>
<div class="tabbar" id="bar">
  <a class="" href="../">天气</a><a class="cur" href="./">主机</a>
</div>
<script>
(function () {
  // Kindle 设备时钟常年不准（常见是停在 UTC），所以不以设备时间为准：
  // 用服务端渲染时刻做基准，之后用毫秒差自行走字，每次页面自刷新都会重新校准。
  var SERVER_MS = 1794646407456;   // 服务端 epoch(ms)
  var TZ_OFF = 8;         // 显示时区偏移（小时，如 8）
  var OFFSET = SERVER_MS - (new Date()).getTime();
  var bar = document.getElementById('bar');
  var main = document.getElementById('main');
  function layout() {
    var h = window.innerHeight || document.documentElement.clientHeight || 0;
    var b = bar ? bar.offsetHeight : 0;
    if (main && h > b + 120) {
      main.style.height = (h - b) + 'px';
      document.body.style.overflow = 'hidden';
    }
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var WD = '日一二三四五六';
  function tick() {
    // 关键：一律用 *UTC* 取值再看偏移，别用 getHours()——设备时区若被设成 UTC，
    // getHours() 会把 03:52 直接显示出来（本 bug 的成因）。
    var d = new Date((new Date()).getTime() + OFFSET + TZ_OFF * 3600000);
    var c = document.getElementById('clock');
    var t = document.getElementById('date');
    if (c) { c.innerHTML = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
    if (t) { t.innerHTML = d.getUTCFullYear() + '年' + pad(d.getUTCMonth() + 1) + '月'
      + pad(d.getUTCDate()) + '日 周' + WD[d.getUTCDay()]; }
    var ms = 60000 - (d.getUTCSeconds() * 1000 + d.getUTCMilliseconds());
    setTimeout(tick, ms > 500 ? ms : 1000);
  }
  layout(); tick();
  window.onresize = layout;
})();
</script>
</body>
</html>
